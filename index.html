<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flashcards — Bac de Français</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, sans-serif;
  background: #f5f5f5;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.barre {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px;
  background: #fff;
  border-bottom: 1px solid #ccc;
  align-items: center;
}
.barre select, .barre button {
  font-size: 15px;
  padding: 6px 10px;
  border: 1px solid #aaa;
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
}
.barre button.actif { background: #ddeeff; }
.compteur {
  text-align: center;
  padding: 6px;
  font-size: 14px;
  color: #555;
}
.carte {
  flex: 1;
  margin: 8px 12px;
  background: #fff;
  border: 2px solid #bbb;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  cursor: pointer;
  overflow-y: auto;
}
.carte.revelee { background: #f0f0ff; border-color: #88a; }
.carte-texte {
  font-size: 18px;
  text-align: center;
  line-height: 1.5;
  max-width: 100%;
}
.carte-texte .petit { font-size: 14px; color: #666; margin-top: 10px; }
.carte-texte .intro { text-align: left; font-size: 15px; line-height: 1.45; }
.carte-texte .intro .bloc { margin-bottom: 12px; }
.carte-texte .intro .bloc:last-child { margin-bottom: 0; }
.carte-texte .intro .titre-bloc { font-weight: bold; color: #335; margin-bottom: 4px; }
.carte-texte .intro ul { margin: 0; padding-left: 18px; }
.carte-texte .intro li { margin-bottom: 3px; }
.carte-texte .intro .sous { margin-top: 3px; color: #444; }
.nav {
  display: flex;
  gap: 8px;
  padding: 8px 12px 12px;
  justify-content: center;
}
.nav button {
  font-size: 16px;
  padding: 10px 18px;
  border: 1px solid #aaa;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  flex: 1;
  max-width: 160px;
}
.nav button:active { background: #eee; }
</style>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$']] }, svg: { fontCache: 'global' } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>

<div class="barre">
  <select id="filtre">
    <option value="Tout">Tout</option>
    <option value="Figures de style">Figures de style</option>
    <option value="Registres">Registres</option>
    <option value="Mouvements">Mouvements</option>
    <option value="Versification">Versification</option>
    <option value="Formes poétiques">Formes poétiques</option>
    <option value="Sonorités">Sonorités</option>
    <option value="Lexique d'analyse">Lexique d'analyse</option>
    <option value="Intros oral">Intros oral</option>
    <option value="Nomenclature">Nomenclature</option>
    <option value="Formules mathématiques">Formules mathématiques</option>
    <option value="Formules physique-chimie">Formules physique-chimie</option>
  </select>
  <button id="btnMode">Mode : Normal</button>
</div>

<div class="compteur" id="compteur"></div>

<div class="carte" id="carte">
  <div class="carte-texte" id="carteTxt"></div>
</div>

<div class="nav">
  <button id="btnPrec">⏮ Préc.</button>
  <button id="btnMel">🔀 Mélanger</button>
  <button id="btnSuiv">Suiv. ⏭</button>
</div>

<script>
var CARTES = [
  // === FIGURES DE STYLE ===
  {nom:"Comparaison", definition:"Rapprochement via un outil de comparaison (comme, tel, ainsi que…).", exemple:"« Il est fort comme un lion. »", categorie:"Figures de style"},
  {nom:"Métaphore", definition:"Comparaison sans outil, image implicite entre deux éléments.", exemple:"« Cet homme est un lion. »", categorie:"Figures de style"},
  {nom:"Personnification", definition:"Attribuer des caractéristiques humaines à un objet, animal ou idée abstraite.", exemple:"« La mer murmurait doucement. »", categorie:"Figures de style"},
  {nom:"Allégorie", definition:"Représentation concrète et imagée d'une idée abstraite, souvent prolongée.", exemple:"La Justice = femme aux yeux bandés tenant une balance.", categorie:"Figures de style"},
  {nom:"Antithèse", definition:"Opposition de deux termes ou idées contraires dans une même phrase.", exemple:"« Je vis, je meurs ; je me brûle et me noie. » (Labé)", categorie:"Figures de style"},
  {nom:"Oxymore", definition:"Alliance de deux mots de sens contraire dans un même groupe syntaxique.", exemple:"« Cette obscure clarté qui tombe des étoiles » (Corneille)", categorie:"Figures de style"},
  {nom:"Chiasme", definition:"Structure croisée AB/BA qui met en valeur une symétrie ou une opposition.", exemple:"« Il faut manger pour vivre, et non vivre pour manger. » (Molière)", categorie:"Figures de style"},
  {nom:"Antiphrase / Ironie", definition:"Dire le contraire de ce que l'on pense, dans une intention moqueuse.", exemple:"« Quel beau temps ! » (sous la pluie)", categorie:"Figures de style"},
  {nom:"Hyperbole", definition:"Exagération dans les termes utilisés pour frapper l'imagination.", exemple:"« Je meurs de faim. »", categorie:"Figures de style"},
  {nom:"Euphémisme", definition:"Atténuation d'une réalité désagréable par une expression adoucie.", exemple:"« Il nous a quittés » = il est mort.", categorie:"Figures de style"},
  {nom:"Litote", definition:"Dire moins pour suggérer davantage. On affirme en niant le contraire.", exemple:"« Va, je ne te hais point. » = je t'aime (Corneille)", categorie:"Figures de style"},
  {nom:"Gradation", definition:"Succession de termes d'intensité croissante ou décroissante.", exemple:"« Je le vis, je rougis, je pâlis à sa vue. » (Racine)", categorie:"Figures de style"},
  {nom:"Anaphore", definition:"Répétition d'un même mot ou groupe en début de vers, phrase ou proposition.", exemple:"« Moi président… Moi président… »", categorie:"Figures de style"},
  {nom:"Énumération / Accumulation", definition:"Liste de termes de même nature créant un effet d'abondance ou d'insistance.", exemple:"« Des bateaux, des maisons, des ponts, des rues. »", categorie:"Figures de style"},
  {nom:"Métonymie", definition:"Remplacement d'un mot par un autre lié logiquement (contenant/contenu, cause/effet…).", exemple:"« Boire un verre » = le contenant pour le contenu.", categorie:"Figures de style"},
  {nom:"Synecdoque", definition:"Désigner le tout par la partie ou la partie par le tout.", exemple:"« Les voiles au loin » = les bateaux.", categorie:"Figures de style"},
  {nom:"Périphrase", definition:"Remplacer un mot par une expression plus longue qui le décrit.", exemple:"« La Ville Lumière » = Paris.", categorie:"Figures de style"},
  {nom:"Métaphore filée", definition:"Métaphore développée sur plusieurs vers ou phrases, formant un réseau d'images cohérent.", exemple:"Le champ lexical maritime chez Hugo pour évoquer le destin.", categorie:"Figures de style"},
  {nom:"Parallélisme", definition:"Répétition d'une même structure syntaxique pour créer un effet de symétrie.", exemple:"« Je n'ai plus que les os… Je n'ai plus que les os… » (Ronsard)", categorie:"Figures de style"},

  // === REGISTRES ===
  {nom:"Registre tragique", definition:"Fatalité, mort, impuissance face au destin. Procédés : champ lexical de la mort, exclamations, dilemme.", exemple:"Racine (Phèdre), Corneille.", categorie:"Registres"},
  {nom:"Registre comique", definition:"Faire rire. Procédés : jeux de mots, quiproquos, répétitions, exagérations.", exemple:"Molière (Le Malade imaginaire, Les Fourberies de Scapin).", categorie:"Registres"},
  {nom:"Registre lyrique", definition:"Expression des sentiments personnels. Procédés : 1ʳᵉ personne, exclamations, métaphores, musicalité.", exemple:"Lamartine (« Le Lac »), Musset.", categorie:"Registres"},
  {nom:"Registre pathétique", definition:"Susciter pitié et compassion. Procédés : champ lexical de la souffrance, hyperboles, interjections.", exemple:"Hugo (Les Misérables), Zola (Germinal).", categorie:"Registres"},
  {nom:"Registre épique", definition:"Glorifier des exploits héroïques. Procédés : hyperboles, énumérations, comparaisons grandioses.", exemple:"Hugo (« Les Châtiments »).", categorie:"Registres"},
  {nom:"Registre fantastique", definition:"Créer le doute entre réel et surnaturel. Procédés : champ lexical de l'étrange, modalisateurs.", exemple:"Maupassant (« Le Horla »), Hoffmann.", categorie:"Registres"},
  {nom:"Registre polémique", definition:"Critiquer, dénoncer avec véhémence. Procédés : ironie, antiphrases, vocabulaire dépréciatif.", exemple:"Voltaire (Traité sur la tolérance), Zola (« J'accuse »).", categorie:"Registres"},
  {nom:"Registre didactique", definition:"Instruire, transmettre un savoir. Procédés : présent de vérité générale, vocabulaire technique, exemples.", exemple:"La Fontaine (Fables), Montaigne (Essais), encyclopédistes.", categorie:"Registres"},
  {nom:"Registre satirique", definition:"Se moquer pour critiquer. Procédés : ironie, caricature, exagération.", exemple:"La Fontaine, Voltaire (Candide), Molière (Tartuffe).", categorie:"Registres"},
  {nom:"Registre élégiaque", definition:"Plainte mélancolique liée à la perte, au deuil, à la fuite du temps.", exemple:"", categorie:"Registres"},

  // === MOUVEMENTS ===
  {nom:"Humanisme", siecle:"XVIe siècle", definition:"Confiance en l'homme, soif de savoir, retour aux textes antiques, éducation.", exemple:"Rabelais, Montaigne.", categorie:"Mouvements"},
  {nom:"La Pléiade", siecle:"XVIe siècle", definition:"Enrichir la langue française, imiter les Anciens, élever la poésie.", exemple:"Ronsard, Du Bellay.", categorie:"Mouvements"},
  {nom:"Baroque", siecle:"Fin XVIe – déb. XVIIe", definition:"Instabilité, illusion, mouvement, profusion ornementale, thème de la vanité.", exemple:"D'Aubigné, Saint-Amant.", categorie:"Mouvements"},
  {nom:"Classicisme", siecle:"XVIIe siècle", definition:"Ordre, mesure, clarté, imitation des Anciens, règle des trois unités, vraisemblance.", exemple:"Molière, Racine, La Fontaine, Boileau.", categorie:"Mouvements"},
  {nom:"Les Lumières", siecle:"XVIIIe siècle", definition:"Raison, progrès, tolérance, critique de l'absolutisme et des préjugés.", exemple:"Voltaire, Diderot, Rousseau, Montesquieu.", categorie:"Mouvements"},
  {nom:"Romantisme", siecle:"1ʳᵉ moitié du XIXe", definition:"Exaltation du moi, sentiment de la nature, mélancolie, liberté créatrice.", exemple:"Hugo, Musset, Lamartine, Chateaubriand.", categorie:"Mouvements"},
  {nom:"Réalisme", siecle:"Milieu du XIXe", definition:"Représentation fidèle de la réalité sociale, observation minutieuse.", exemple:"Balzac, Flaubert, Stendhal.", categorie:"Mouvements"},
  {nom:"Naturalisme", siecle:"Fin du XIXe", definition:"Prolongement du réalisme avec démarche scientifique (hérédité, milieu).", exemple:"Zola (Les Rougon-Macquart), Maupassant.", categorie:"Mouvements"},
  {nom:"Symbolisme", siecle:"Fin du XIXe", definition:"Suggestion plutôt que description, musicalité, symboles, monde intérieur.", exemple:"Baudelaire, Verlaine, Rimbaud, Mallarmé.", categorie:"Mouvements"},
  {nom:"Surréalisme", siecle:"XXe siècle (dès 1924)", definition:"Écriture automatique, exploration de l'inconscient, rejet de la logique rationnelle.", exemple:"Breton, Éluard, Aragon, Desnos.", categorie:"Mouvements"},
  {nom:"Existentialisme", siecle:"XXe siècle (1940–1960)", definition:"L'existence précède l'essence, liberté, responsabilité, absurde.", exemple:"Sartre, Camus, Beauvoir.", categorie:"Mouvements"},
  {nom:"Nouveau Roman", siecle:"Milieu du XXe", definition:"Rejet du roman traditionnel, expérimentation formelle, remise en question de la narration.", exemple:"Robbe-Grillet, Sarraute, Butor, Duras.", categorie:"Mouvements"},

  // === VERSIFICATION ===
  // Types de vers
  {nom:"Alexandrin", definition:"Vers de 12 syllabes, le plus noble de la poésie classique.", exemple:"« Je suis le ténébreux, le veuf, l'inconsolé » (Nerval)", categorie:"Versification"},
  {nom:"Décasyllabe", definition:"Vers de 10 syllabes, fréquent au Moyen Âge et chez les symbolistes.", exemple:"Villon, Verlaine.", categorie:"Versification"},
  {nom:"Octosyllabe", definition:"Vers de 8 syllabes, rythme léger et musical.", exemple:"Fréquent dans les fables et chansons.", categorie:"Versification"},
  {nom:"Vers libre", definition:"Vers de longueur variable, sans mètre régulier. Fin XIXe siècle.", exemple:"Rimbaud, Apollinaire, Char.", categorie:"Versification"},
  {nom:"Vers impair", definition:"Vers de 5, 7, 9 ou 11 syllabes. Privilégié par Verlaine.", exemple:"« De la musique avant toute chose » (Verlaine)", categorie:"Versification"},
  // Décompte des syllabes
  {nom:"Diérèse", definition:"Prononciation en deux syllabes d'une voyelle habituellement groupée en une seule. Met en relief le mot.", exemple:"li-on au lieu de lion.", categorie:"Versification"},
  {nom:"Synérèse", definition:"Prononciation en une seule syllabe de deux voyelles habituellement séparées. Accélère le rythme.", exemple:"lion en une syllabe.", categorie:"Versification"},
  {nom:"E muet / e caduc", definition:"Le e se prononce devant une consonne, s'élide devant une voyelle ou un h muet, ne se compte pas en fin de vers.", exemple:"", categorie:"Versification"},
  // Rimes
  {nom:"Rime pauvre", definition:"Un seul phonème en commun.", exemple:"vie / amie.", categorie:"Versification"},
  {nom:"Rime suffisante", definition:"Deux phonèmes en commun.", exemple:"automne / colonne.", categorie:"Versification"},
  {nom:"Rime riche", definition:"Trois phonèmes ou plus en commun.", exemple:"tendresse / paresse.", categorie:"Versification"},
  {nom:"Rimes plates (suivies)", definition:"Schéma de rimes AABB.", exemple:"", categorie:"Versification"},
  {nom:"Rimes croisées", definition:"Schéma de rimes ABAB.", exemple:"", categorie:"Versification"},
  {nom:"Rimes embrassées", definition:"Schéma de rimes ABBA.", exemple:"", categorie:"Versification"},
  {nom:"Rime féminine", definition:"Rime se terminant par un e muet (son doux, prolongement).", exemple:"", categorie:"Versification"},
  {nom:"Rime masculine", definition:"Rime ne se terminant pas par un e muet (son net, ferme).", exemple:"", categorie:"Versification"},
  // Rythme et coupes
  {nom:"Césure", definition:"Coupe principale dans l'alexandrin, le divise en deux hémistiches de 6 syllabes (6//6).", exemple:"", categorie:"Versification"},
  {nom:"Hémistiche", definition:"Chacune des deux moitiés de l'alexandrin, séparées par la césure.", exemple:"", categorie:"Versification"},
  {nom:"Enjambement", definition:"La phrase déborde sur le vers suivant, effet de continuité ou fluidité.", exemple:"", categorie:"Versification"},
  {nom:"Rejet", definition:"Un élément bref est rejeté au début du vers suivant, effet de surprise ou mise en valeur.", exemple:"", categorie:"Versification"},
  {nom:"Contre-rejet", definition:"Un élément bref anticipe la phrase du vers suivant, effet d'attente.", exemple:"", categorie:"Versification"},
  {nom:"Trimètre", definition:"Alexandrin coupé en trois mesures de 4 syllabes (4/4/4) – rythme ternaire romantique.", exemple:"", categorie:"Versification"},

  // === FORMES POÉTIQUES ===
  {nom:"Sonnet", definition:"14 vers : 2 quatrains + 2 tercets. Forme noble, apogée à la Renaissance et chez les symbolistes.", exemple:"Du Bellay, Ronsard.", categorie:"Formes poétiques"},
  {nom:"Ballade", definition:"3 strophes + 1 envoi, chaque strophe se termine par un refrain. Forme médiévale.", exemple:"Villon.", categorie:"Formes poétiques"},
  {nom:"Rondeau", definition:"Poème à forme circulaire, avec reprise du premier vers. Forme médiévale.", exemple:"", categorie:"Formes poétiques"},
  {nom:"Ode", definition:"Poème lyrique d'inspiration élevée, souvent en strophes régulières.", exemple:"Ronsard, Hugo.", categorie:"Formes poétiques"},
  {nom:"Fable", definition:"Récit versifié à visée morale. Alternance de vers (hétérométrie).", exemple:"La Fontaine.", categorie:"Formes poétiques"},
  {nom:"Poème en prose", definition:"Texte poétique sans vers ni rime.", exemple:"Baudelaire (Le Spleen de Paris), Rimbaud (Illuminations).", categorie:"Formes poétiques"},
  {nom:"Calligramme", definition:"Poème dont la disposition graphique forme un dessin.", exemple:"Apollinaire.", categorie:"Formes poétiques"},
  // Strophes
  {nom:"Distique", definition:"Strophe de 2 vers.", exemple:"", categorie:"Formes poétiques"},
  {nom:"Tercet", definition:"Strophe de 3 vers.", exemple:"", categorie:"Formes poétiques"},
  {nom:"Quatrain", definition:"Strophe de 4 vers.", exemple:"", categorie:"Formes poétiques"},
  {nom:"Quintil", definition:"Strophe de 5 vers.", exemple:"", categorie:"Formes poétiques"},
  {nom:"Sizain", definition:"Strophe de 6 vers.", exemple:"", categorie:"Formes poétiques"},
  {nom:"Huitain", definition:"Strophe de 8 vers.", exemple:"", categorie:"Formes poétiques"},
  {nom:"Dizain", definition:"Strophe de 10 vers.", exemple:"", categorie:"Formes poétiques"},

  // === SONORITÉS ===
  {nom:"Allitération", definition:"Répétition d'un même son consonantique.", exemple:"Dureté [k][t], douceur [l][m], sifflement [s].", categorie:"Sonorités"},
  {nom:"Assonance", definition:"Répétition d'un même son vocalique.", exemple:"Musicalité, écho intérieur, harmonie.", categorie:"Sonorités"},
  {nom:"Harmonie imitative", definition:"Les sons du vers imitent ce qu'il décrit (onomatopée élargie).", exemple:"« Pour qui sont ces serpents qui sifflent sur vos têtes » (Racine)", categorie:"Sonorités"},
  {nom:"Paronomase", definition:"Rapprochement de mots aux sonorités proches mais au sens différent.", exemple:"« Qui se ressemble s'assemble »", categorie:"Sonorités"},

  // === LEXIQUE D'ANALYSE ===
  {nom:"Champ lexical", definition:"Ensemble de mots se rapportant à un même thème.", exemple:"Champ lexical de la mort, de la nature.", categorie:"Lexique d'analyse"},
  {nom:"Énonciation", definition:"Qui parle ? À qui ? Le je lyrique, le destinataire, le ton adopté.", exemple:"", categorie:"Lexique d'analyse"},
  {nom:"Topos / Motif", definition:"Thème récurrent en poésie.", exemple:"Carpe diem, tempus fugit, locus amoenus, memento mori.", categorie:"Lexique d'analyse"},
  {nom:"Lyrisme", definition:"Expression musicale et subjective des sentiments du poète.", exemple:"", categorie:"Lexique d'analyse"},
  {nom:"Spleen", definition:"Ennui existentiel, dégoût profond (terme baudelairien).", exemple:"Baudelaire.", categorie:"Lexique d'analyse"},
  {nom:"Idéal", definition:"Aspiration vers la beauté, l'absolu, le sublime (opposé du spleen chez Baudelaire).", exemple:"Baudelaire.", categorie:"Lexique d'analyse"},
  {nom:"Poétique", definition:"Art du poète, ensemble de procédés et choix esthétiques propres à un auteur ou mouvement.", exemple:"", categorie:"Lexique d'analyse"},
  {nom:"Hétérométrie", definition:"Alternance de vers de longueurs différentes dans un même poème.", exemple:"", categorie:"Lexique d'analyse"},
  {nom:"Isométrie", definition:"Utilisation de vers de même longueur dans un poème.", exemple:"", categorie:"Lexique d'analyse"},
  {nom:"Blason", definition:"Poème célébrant une partie du corps ou un objet. Genre de la Renaissance.", exemple:"", categorie:"Lexique d'analyse"},

  // === NOMENCLATURE — Chimie organique ===
  // Préfixes des alcanes
  {nom:"méth-", definition:"Préfixe pour 1 carbone", exemple:"méthane : CH₄", categorie:"Nomenclature"},
  {nom:"éth-", definition:"Préfixe pour 2 carbones", exemple:"éthane : C₂H₆", categorie:"Nomenclature"},
  {nom:"prop-", definition:"Préfixe pour 3 carbones", exemple:"propane : C₃H₈", categorie:"Nomenclature"},
  {nom:"but-", definition:"Préfixe pour 4 carbones", exemple:"butane : C₄H₁₀", categorie:"Nomenclature"},
  {nom:"pent-", definition:"Préfixe pour 5 carbones", exemple:"pentane : C₅H₁₂", categorie:"Nomenclature"},
  {nom:"hex-", definition:"Préfixe pour 6 carbones", exemple:"hexane : C₆H₁₄", categorie:"Nomenclature"},
  {nom:"hept-", definition:"Préfixe pour 7 carbones", exemple:"heptane : C₇H₁₆", categorie:"Nomenclature"},
  {nom:"oct-", definition:"Préfixe pour 8 carbones", exemple:"octane : C₈H₁₈", categorie:"Nomenclature"},
  {nom:"non-", definition:"Préfixe pour 9 carbones", exemple:"nonane : C₉H₂₀", categorie:"Nomenclature"},
  {nom:"déc-", definition:"Préfixe pour 10 carbones", exemple:"décane : C₁₀H₂₂", categorie:"Nomenclature"},
  // Familles fonctionnelles
  {nom:"Alcool (suffixe -ol)", definition:"Groupe hydroxyle —OH lié à un carbone. Formule générale : R—OH. Formule brute : CₙH₂ₙ₊₂O", exemple:"méthanol (CH₃—OH), éthanol (CH₃—CH₂—OH), propan-1-ol, propan-2-ol", categorie:"Nomenclature"},
  {nom:"Aldéhyde (suffixe -al)", definition:"Groupe carbonyle C=O en bout de chaîne, le C porte aussi un H. Formule générale : R—CHO. Formule brute : CₙH₂ₙO. Le C fonctionnel est toujours le n°1, donc on ne précise pas sa position", exemple:"méthanal (H—CHO), éthanal (CH₃—CHO), propanal", categorie:"Nomenclature"},
  {nom:"Cétone (suffixe -one)", definition:"Groupe carbonyle C=O à l'intérieur de la chaîne (le C est lié à deux autres C). Formule générale : R—CO—R'. Formule brute : CₙH₂ₙO. On précise la position du C=O", exemple:"propanone (acétone), butanone, pentan-3-one", categorie:"Nomenclature"},
  {nom:"Acide carboxylique (acide ...-oïque)", definition:"Groupe carboxyle —COOH en bout de chaîne (C=O + OH sur le même C). Formule générale : R—COOH. Formule brute : CₙH₂ₙO₂. Le C fonctionnel est toujours le n°1", exemple:"acide méthanoïque, acide éthanoïque (vinaigre), acide propanoïque", categorie:"Nomenclature"},
  // Groupes caractéristiques
  {nom:"Groupe hydroxyle", definition:"—OH. Caractéristique de la famille des alcools", exemple:"Suffixe -ol", categorie:"Nomenclature"},
  {nom:"Groupe carbonyle", definition:"C=O. Présent dans les aldéhydes (bout de chaîne) et les cétones (intérieur de chaîne)", exemple:"Aldéhyde : suffixe -al / Cétone : suffixe -one", categorie:"Nomenclature"},
  {nom:"Groupe carboxyle", definition:"—COOH. Combine C=O et —OH sur le même carbone. Caractéristique des acides carboxyliques", exemple:"Suffixe acide ...-oïque", categorie:"Nomenclature"},
  // Concepts clés
  {nom:"Squelette carboné", definition:"Enchaînement des atomes de carbone dans une molécule organique. Peut être linéaire, ramifié ou cyclique", exemple:"", categorie:"Nomenclature"},
  {nom:"Alcane", definition:"Molécule organique composée uniquement de C et H, avec uniquement des liaisons simples (saturé). Formule brute : CₙH₂ₙ₊₂", exemple:"méthane, éthane, propane, butane…", categorie:"Nomenclature"},
  {nom:"Groupe alkyle", definition:"Fragment d'alcane ayant perdu un H. Suffixe -yle (-yl dans le nom composé)", exemple:"méthyl (—CH₃), éthyl (—C₂H₅), propyl (—C₃H₇)", categorie:"Nomenclature"},
  {nom:"Cycloalcane", definition:"Alcane dont la chaîne se referme en cycle. Préfixe cyclo-. Formule brute : CₙH₂ₙ", exemple:"cyclopentane (C₅H₁₀), cyclohexane (C₆H₁₂)", categorie:"Nomenclature"},
  {nom:"Piège aldéhyde vs cétone", definition:"Les deux ont un C=O mais : aldéhyde = C=O en bout de chaîne (suffixe -al), cétone = C=O au milieu (suffixe -one). Propanal et propanone ont la même formule brute C₃H₆O !", exemple:"propanal (CH₃CH₂CHO) ≠ propanone (CH₃COCH₃)", categorie:"Nomenclature"},
  // Nomenclature des ramifications
  {nom:"Règles de nomenclature", definition:"1) Chaîne la plus longue = nom de base. 2) Numéroter pour que les ramifications aient les plus petits numéros. 3) Nommer les groupes alkyles avec leur position. 4) Préfixes di-, tri-, tétra- si répétition. 5) Ordre alphabétique", exemple:"2-méthylbutane, 2,4-diméthylpentane", categorie:"Nomenclature"},
  // Spectroscopie IR
  {nom:"Spectroscopie IR (principe)", definition:"Technique qui identifie les groupes caractéristiques. Chaque liaison vibre à une fréquence propre et absorbe le rayonnement IR correspondant → pic (creux) sur le spectre", exemple:"Axe X : nombre d'onde σ (cm⁻¹, de 4000 à 400). Axe Y : transmittance T (%)", categorie:"Nomenclature"},
  {nom:"Bande O—H alcool", definition:"Bande large entre 3200–3550 cm⁻¹ (alcool pur/lié). Fine vers 3600 cm⁻¹ (alcool libre/dilué)", exemple:"Plus les liaisons H sont fortes, plus la bande est large et décalée vers les bas nombres d'onde", categorie:"Nomenclature"},
  {nom:"Bande O—H acide carboxylique", definition:"Bande très large de 2500 à 3300 cm⁻¹, recouvre la zone des C—H", exemple:"Liaisons hydrogène très fortes", categorie:"Nomenclature"},
  {nom:"Bande C=O (carbonyle)", definition:"Pic fort et fin entre 1650–1750 cm⁻¹", exemple:"Présent dans aldéhydes, cétones et acides carboxyliques", categorie:"Nomenclature"},
  {nom:"Bande C—H", definition:"Absorption entre 2800–3100 cm⁻¹, moyenne à forte", exemple:"Présente dans toutes les molécules organiques", categorie:"Nomenclature"},
  {nom:"Méthode d'identification IR", definition:"1) Bande O—H large ? → alcool ou acide. 2) Pic C=O vers 1700 ? → carbonyle. 3) O—H large + C=O ? → acide carboxylique. 4) C=O seul → aldéhyde ou cétone. 5) O—H seul → alcool", exemple:"Toujours justifier en citant le nombre d'onde et l'aspect de la bande", categorie:"Nomenclature"},
  {nom:"Zone empreinte digitale", definition:"Zone 1500–400 cm⁻¹. Complexe, propre à chaque molécule. Ne s'interprète pas bande par bande. Sert à confirmer l'identité par comparaison avec un spectre de référence", exemple:"", categorie:"Nomenclature"},

  // Algèbre — Suites arithmétiques
  {nom:"Suite arithmétique — relation de récurrence", definition:"$u_{n+1} = u_n + r$", categorie:"Formules mathématiques"},
  {nom:"Suite arithmétique — terme général", definition:"$u_n = u_0 + n\\,r = u_p + (n-p)\\,r$", categorie:"Formules mathématiques"},
  {nom:"Suite arithmétique — somme des termes", definition:"$S = \\dfrac{(\\text{nb termes})\\,(u_{\\text{1er}} + u_{\\text{dernier}})}{2}$", categorie:"Formules mathématiques"},
  {nom:"Somme des entiers $1 + 2 + \\cdots + n$", definition:"$1 + 2 + \\cdots + n = \\dfrac{n(n+1)}{2}$", categorie:"Formules mathématiques"},
  // Algèbre — Suites géométriques
  {nom:"Suite géométrique — relation de récurrence", definition:"$u_{n+1} = q\\,u_n$", categorie:"Formules mathématiques"},
  {nom:"Suite géométrique — terme général", definition:"$u_n = u_0\\,q^{\\,n} = u_p\\,q^{\\,n-p}$", categorie:"Formules mathématiques"},
  {nom:"Suite géométrique — somme (raison $q \\neq 1$)", definition:"$1 + q + q^2 + \\cdots + q^{n} = \\dfrac{1 - q^{\\,n+1}}{1 - q}$", categorie:"Formules mathématiques"},
  {nom:"Suite géométrique — somme (forme générale)", definition:"$S = (\\text{1er terme}) \\times \\dfrac{1 - q^{\\text{nb termes}}}{1 - q}$", categorie:"Formules mathématiques"},
  // Algèbre — Second degré
  {nom:"Second degré — forme canonique", definition:"$f(x) = a(x - \\alpha)^2 + \\beta, \\quad \\alpha = -\\dfrac{b}{2a},\\ \\beta = f(\\alpha)$", categorie:"Formules mathématiques"},
  {nom:"Second degré — discriminant", definition:"$\\Delta = b^2 - 4ac$", categorie:"Formules mathématiques"},
  {nom:"Second degré — racines (Δ > 0)", definition:"$x = \\dfrac{-b \\pm \\sqrt{\\Delta}}{2a}$", categorie:"Formules mathématiques"},
  {nom:"Second degré — racine double (Δ = 0)", definition:"$x = \\dfrac{-b}{2a}$", categorie:"Formules mathématiques"},
  {nom:"Second degré — factorisation", definition:"$f(x) = a(x - x_1)(x - x_2)$", categorie:"Formules mathématiques"},
  {nom:"Second degré — somme et produit des racines", definition:"$x_1 + x_2 = -\\dfrac{b}{a}, \\quad x_1 x_2 = \\dfrac{c}{a}$", categorie:"Formules mathématiques"},
  {nom:"Second degré — sommet de la parabole", definition:"$S\\,(\\alpha\\,;\\,\\beta)$", categorie:"Formules mathématiques"},
  // Analyse — Dérivation
  {nom:"Nombre dérivé", definition:"$f'(a) = \\lim\\limits_{h \\to 0} \\dfrac{f(a+h) - f(a)}{h}$", categorie:"Formules mathématiques"},
  {nom:"Équation de la tangente en $a$", definition:"$y = f'(a)\\,(x - a) + f(a)$", categorie:"Formules mathématiques"},
  // Analyse — Dérivées usuelles
  {nom:"Dérivée d'une constante", definition:"$(k)' = 0$", categorie:"Formules mathématiques"},
  {nom:"Dérivée de $x$", definition:"$(x)' = 1$", categorie:"Formules mathématiques"},
  {nom:"Dérivée de $x^n$", definition:"$(x^n)' = n\\,x^{\\,n-1}$", categorie:"Formules mathématiques"},
  {nom:"Dérivée de $\\dfrac{1}{x}$", definition:"$\\left(\\dfrac{1}{x}\\right)' = -\\dfrac{1}{x^2}$", categorie:"Formules mathématiques"},
  {nom:"Dérivée de $\\sqrt{x}$", definition:"$(\\sqrt{x})' = \\dfrac{1}{2\\sqrt{x}}$", categorie:"Formules mathématiques"},
  {nom:"Dérivée de $e^x$", definition:"$(e^x)' = e^x$", categorie:"Formules mathématiques"},
  {nom:"Dérivée de $\\cos x$", definition:"$(\\cos x)' = -\\sin x$", categorie:"Formules mathématiques"},
  {nom:"Dérivée de $\\sin x$", definition:"$(\\sin x)' = \\cos x$", categorie:"Formules mathématiques"},
  // Analyse — Opérations sur les dérivées
  {nom:"Dérivée d'une somme", definition:"$(u + v)' = u' + v'$", categorie:"Formules mathématiques"},
  {nom:"Dérivée du produit par une constante", definition:"$(k\\,u)' = k\\,u'$", categorie:"Formules mathématiques"},
  {nom:"Dérivée d'un produit", definition:"$(uv)' = u'v + uv'$", categorie:"Formules mathématiques"},
  {nom:"Dérivée de l'inverse", definition:"$\\left(\\dfrac{1}{v}\\right)' = -\\dfrac{v'}{v^2}$", categorie:"Formules mathématiques"},
  {nom:"Dérivée d'un quotient", definition:"$\\left(\\dfrac{u}{v}\\right)' = \\dfrac{u'v - uv'}{v^2}$", categorie:"Formules mathématiques"},
  {nom:"Dérivée de $u^n$", definition:"$(u^n)' = n\\,u'\\,u^{\\,n-1}$", categorie:"Formules mathématiques"},
  {nom:"Dérivée de $e^u$", definition:"$(e^u)' = u'\\,e^u$", categorie:"Formules mathématiques"},

  {nom:"Exponentielle — valeurs et signe", definition:"$e^0 = 1, \\quad e^1 = e, \\quad e^x > 0$", categorie:"Formules mathématiques"},
  {nom:"Exponentielle — somme des exposants", definition:"$e^{a+b} = e^a \\times e^b$", categorie:"Formules mathématiques"},
  {nom:"Exponentielle — exposant opposé", definition:"$e^{-a} = \\dfrac{1}{e^a}$", categorie:"Formules mathématiques"},
  {nom:"Exponentielle — différence des exposants", definition:"$e^{a-b} = \\dfrac{e^a}{e^b}$", categorie:"Formules mathématiques"},
  {nom:"Exponentielle — puissance", definition:"$(e^a)^n = e^{\\,na}$", categorie:"Formules mathématiques"},
  // Analyse — Trigonométrie
  {nom:"Relation $\\cos^2 + \\sin^2$", definition:"$\\cos^2 x + \\sin^2 x = 1$", categorie:"Formules mathématiques"},
  {nom:"Trigonométrie — parité", definition:"$\\cos(-x) = \\cos x, \\quad \\sin(-x) = -\\sin x$", categorie:"Formules mathématiques"},
  {nom:"Trigonométrie — périodicité $2\\pi$", definition:"$\\cos(x + 2\\pi) = \\cos x, \\quad \\sin(x + 2\\pi) = \\sin x$", categorie:"Formules mathématiques"},
  {nom:"Angles associés : $\\pi - x$", definition:"$\\cos(\\pi - x) = -\\cos x, \\quad \\sin(\\pi - x) = \\sin x$", categorie:"Formules mathématiques"},
  {nom:"Angles associés : $\\pi + x$", definition:"$\\cos(\\pi + x) = -\\cos x, \\quad \\sin(\\pi + x) = -\\sin x$", categorie:"Formules mathématiques"},
  {nom:"Angles associés : $\\dfrac{\\pi}{2} - x$", definition:"$\\cos\\!\\left(\\dfrac{\\pi}{2} - x\\right) = \\sin x, \\quad \\sin\\!\\left(\\dfrac{\\pi}{2} - x\\right) = \\cos x$", categorie:"Formules mathématiques"},
  {nom:"Trigonométrie — valeurs remarquables", definition:"Angles à connaître : $0,\\ \\dfrac{\\pi}{6},\\ \\dfrac{\\pi}{4},\\ \\dfrac{\\pi}{3},\\ \\dfrac{\\pi}{2}$", categorie:"Formules mathématiques"},
  // Géométrie — Produit scalaire
  {nom:"Produit scalaire — norme et angle", definition:"$\\vec{u} \\cdot \\vec{v} = \\lVert \\vec{u} \\rVert\\,\\lVert \\vec{v} \\rVert \\cos\\theta$", categorie:"Formules mathématiques"},
  {nom:"Produit scalaire — coordonnées", definition:"$\\vec{u} \\cdot \\vec{v} = xx' + yy'$", categorie:"Formules mathématiques"},
  {nom:"Produit scalaire — formule des normes", definition:"$\\vec{u} \\cdot \\vec{v} = \\dfrac{1}{2}\\left(\\lVert \\vec{u} \\rVert^2 + \\lVert \\vec{v} \\rVert^2 - \\lVert \\vec{u} - \\vec{v} \\rVert^2\\right)$", categorie:"Formules mathématiques"},
  {nom:"Carré scalaire et norme", definition:"$\\lVert \\vec{u} \\rVert^2 = \\vec{u} \\cdot \\vec{u}, \\quad \\lVert \\vec{u} \\rVert = \\sqrt{x^2 + y^2}$", categorie:"Formules mathématiques"},
  {nom:"Orthogonalité de deux vecteurs", definition:"$\\vec{u} \\perp \\vec{v} \\iff \\vec{u} \\cdot \\vec{v} = 0$", categorie:"Formules mathématiques"},
  {nom:"Théorème d'Al-Kashi", definition:"$a^2 = b^2 + c^2 - 2bc\\cos A$", categorie:"Formules mathématiques"},
  // Géométrie — Géométrie repérée
  {nom:"Coordonnées du vecteur $\\vec{AB}$", definition:"$\\vec{AB}\\,(x_B - x_A\\,;\\, y_B - y_A)$", categorie:"Formules mathématiques"},
  {nom:"Distance entre deux points", definition:"$AB = \\sqrt{(x_B - x_A)^2 + (y_B - y_A)^2}$", categorie:"Formules mathématiques"},
  {nom:"Coordonnées du milieu", definition:"$\\left(\\dfrac{x_A + x_B}{2}\\,;\\, \\dfrac{y_A + y_B}{2}\\right)$", categorie:"Formules mathématiques"},
  {nom:"Équation cartésienne d'une droite", definition:"$ax + by + c = 0$ — directeur $(-b\\,;\\,a)$, normal $(a\\,;\\,b)$", categorie:"Formules mathématiques"},
  {nom:"Équation d'un cercle", definition:"$(x - a)^2 + (y - b)^2 = r^2$ — centre $(a\\,;\\,b)$, rayon $r$", categorie:"Formules mathématiques"},
  // Probabilités — Probabilités conditionnelles
  {nom:"Probabilité conditionnelle", definition:"$P_A(B) = \\dfrac{P(A \\cap B)}{P(A)}$", categorie:"Formules mathématiques"},
  {nom:"Probabilité d'une intersection", definition:"$P(A \\cap B) = P(A) \\times P_A(B)$", categorie:"Formules mathématiques"},
  {nom:"Formule des probabilités totales", definition:"$P(B) = P(A)\\,P_A(B) + P(\\overline{A})\\,P_{\\overline{A}}(B)$", categorie:"Formules mathématiques"},
  {nom:"Événements indépendants", definition:"$P(A \\cap B) = P(A) \\times P(B)$", categorie:"Formules mathématiques"},
  {nom:"Probabilité de l'événement contraire", definition:"$P(\\overline{A}) = 1 - P(A)$", categorie:"Formules mathématiques"},
  {nom:"Probabilité d'une union", definition:"$P(A \\cup B) = P(A) + P(B) - P(A \\cap B)$", categorie:"Formules mathématiques"},
  // Probabilités — Variables aléatoires
  {nom:"Espérance d'une variable aléatoire", definition:"$E(X) = \\sum x_i\\,p_i$", categorie:"Formules mathématiques"},
  {nom:"Variance d'une variable aléatoire", definition:"$V(X) = \\sum p_i\\,(x_i - E(X))^2 = E(X^2) - [E(X)]^2$", categorie:"Formules mathématiques"},
  {nom:"Écart-type", definition:"$\\sigma(X) = \\sqrt{V(X)}$", categorie:"Formules mathématiques"},
  {nom:"Linéarité de l'espérance", definition:"$E(aX + b) = a\\,E(X) + b$", categorie:"Formules mathématiques"},
  {nom:"Variance de $aX + b$", definition:"$V(aX + b) = a^2\\,V(X)$", categorie:"Formules mathématiques"},

  {nom:"Quantité de matière d'un liquide à partir de son volume, de sa masse volumique ou de sa densité ?", categorie:"Formules physique-chimie", id:"C0-05", chapitre:"C0", theme:"Quantité de matière", niveau:"premiere", difficulte:2, tags:["quantite-matiere","densite","masse-volumique"], verso_latex:"n = \\dfrac{\\rho \\times V}{M} = \\dfrac{d \\times \\rho_{\\text{eau}} \\times V}{M}", verso_texte:"n = (ρ × V) / M = (d × ρ_eau × V) / M", verso:"$n = \\dfrac{\\rho \\times V}{M} = \\dfrac{d \\times \\rho_{\\text{eau}} \\times V}{M}$<div class=\"petit\">n — mol<br>ρ — g·mL⁻¹ ou g·L⁻¹<br>V — mL ou L<br>M — g·mol⁻¹<br>d — sans unité</div><div class=\"petit\">Piège : Se retrouve en composant n = m/M et ρ = m/V. Cohérence des unités de V et ρ obligatoire.</div>"},

  {nom:"Quantité de matière restante d'un réactif A à l'avancement x ?", categorie:"Formules physique-chimie", id:"C0-09", chapitre:"C0", theme:"Avancement", niveau:"premiere", difficulte:1, tags:["avancement","tableau-avancement"], verso_latex:"n(A)_{\\text{restant}} = n_0(A) - a\\,x", verso_texte:"n(A)restant = n0(A) − a·x", verso:"$n(A)_{\\text{restant}} = n_0(A) - a\\,x$<div class=\"petit\">Piège : Ne pas oublier le nombre stœchiométrique a devant x.</div>"},
  {nom:"Quantité de matière formée d'un produit C à l'avancement x (si n0(C) = 0) ?", categorie:"Formules physique-chimie", id:"C0-10", chapitre:"C0", theme:"Avancement", niveau:"premiere", difficulte:1, tags:["avancement","tableau-avancement"], verso_latex:"n(C)_{\\text{formé}} = c\\,x", verso_texte:"n(C)formé = c·x", verso:"$n(C)_{\\text{formé}} = c\\,x$"},
  {nom:"Comment détermine-t-on l'avancement maximal et le réactif limitant ?", categorie:"Formules physique-chimie", id:"C0-11", chapitre:"C0", theme:"Avancement", niveau:"premiere", difficulte:2, tags:["avancement","reactif-limitant"], verso_latex:"x_{max} = \\min\\left(\\dfrac{n_0(A)}{a}\\;;\\;\\dfrac{n_0(B)}{b}\\right)", verso_texte:"x_max = min( n0(A)/a ; n0(B)/b )", verso:"$x_{max} = \\min\\left(\\dfrac{n_0(A)}{a}\\;;\\;\\dfrac{n_0(B)}{b}\\right)$<div class=\"petit\">Piège : Le réactif limitant est celui qui donne la <b>plus petite</b> valeur. Égalité ⇒ mélange <b>stœchiométrique</b>, les deux réactifs sont limitants.</div>"},
  {nom:"Condition sur les quantités initiales pour que les réactifs soient dans les proportions stœchiométriques ?", categorie:"Formules physique-chimie", id:"C0-12", chapitre:"C0", theme:"Avancement", niveau:"premiere", difficulte:2, tags:["stoechiometrie","reactif-limitant"], verso_latex:"\\dfrac{n_0(A)}{a} = \\dfrac{n_0(B)}{b}", verso_texte:"n0(A)/a = n0(B)/b", verso:"$\\dfrac{n_0(A)}{a} = \\dfrac{n_0(B)}{b}$<div class=\"petit\">Piège : Les deux réactifs sont alors entièrement consommés en fin de réaction (si elle est totale).</div>"},
  // Concentrations
  {nom:"Définition de la concentration molaire d'une solution ?", categorie:"Formules physique-chimie", id:"C0-13", chapitre:"C0", theme:"Concentrations", niveau:"premiere", difficulte:1, tags:["concentration","solution"], verso_latex:"C = \\dfrac{n_{\\text{soluté}}}{V}", verso_texte:"C = n_soluté / V", verso:"$C = \\dfrac{n_{\\text{soluté}}}{V}$<div class=\"petit\">C — concentration molaire — mol·L⁻¹<br>n — quantité de soluté dissous — mol<br>V — volume de <b>solution</b> — L</div><div class=\"petit\">Piège : V est le volume de <b>solution</b>, pas de solvant.</div>"},
  {nom:"Définition de la concentration massique d'une solution ?", categorie:"Formules physique-chimie", id:"C0-14", chapitre:"C0", theme:"Concentrations", niveau:"premiere", difficulte:1, tags:["concentration","solution"], verso_latex:"C_m = \\dfrac{m_{\\text{soluté}}}{V}", verso_texte:"Cm = m_soluté / V", verso:"$C_m = \\dfrac{m_{\\text{soluté}}}{V}$<div class=\"petit\">Cm — g·L⁻¹<br>m — masse de soluté dissous — g<br>V — volume de solution — L</div>"},
  {nom:"Relation entre concentration massique et concentration molaire (et sa démonstration) ?", categorie:"Formules physique-chimie", id:"C0-15", chapitre:"C0", theme:"Concentrations", niveau:"premiere", difficulte:2, tags:["concentration","demonstration"], verso_latex:"C_m = \\dfrac{m}{V} = \\dfrac{n \\times M}{V} = C \\times M", verso_texte:"Cm = m/V = (n × M)/V = C × M", verso:"$C_m = \\dfrac{m}{V} = \\dfrac{n \\times M}{V} = C \\times M$<div class=\"petit\">Piège : Le cours précise « à redémontrer à chaque fois » — ne pas la poser sans justification.</div>"},
  {nom:"Définition du pourcentage massique d'une solution ?", categorie:"Formules physique-chimie", id:"C0-16", chapitre:"C0", theme:"Concentrations", niveau:"premiere", difficulte:1, tags:["pourcentage-massique","concentration"], verso_latex:"P = \\dfrac{m_{\\text{soluté}}}{m_{\\text{solution}}}", verso_texte:"P = m_soluté / m_solution", verso:"$P = \\dfrac{m_{\\text{soluté}}}{m_{\\text{solution}}}$<div class=\"petit\">Piège : Sans unité. Multiplier par 100 pour l&#39;exprimer en %. Un P = 20 % s&#39;utilise comme 0,20 dans les calculs.</div>"},
  {nom:"Relation entre pourcentage massique P, densité d et concentration molaire C ? (démonstration attendue)", categorie:"Formules physique-chimie", id:"C0-17", chapitre:"C0", theme:"Concentrations", niveau:"premiere", difficulte:3, tags:["pourcentage-massique","densite","concentration","demonstration"], verso_latex:"C = \\dfrac{P \\times d \\times \\rho_{\\text{eau}}}{M} = \\dfrac{P \\times \\rho_{\\text{solution}}}{M}", verso_texte:"C = (P × d × ρ_eau) / M = (P × ρ_solution) / M", verso:"$C = \\dfrac{P \\times d \\times \\rho_{\\text{eau}}}{M} = \\dfrac{P \\times \\rho_{\\text{solution}}}{M}$<div class=\"petit\">C — mol·L⁻¹<br>P — sans unité<br>d — sans unité<br>ρ_eau — g·L⁻¹<br>M — g·mol⁻¹</div><div class=\"petit\">Piège : Démonstration : m_soluté = C·V·M et m_solution = d·ρ_eau·V, donc P = C·M/(d·ρ_eau). Le volume V se simplifie — c&#39;est le point clé.</div>"},
  {nom:"Définition de la concentration effective d'une espèce X en solution ?", categorie:"Formules physique-chimie", id:"C0-18", chapitre:"C0", theme:"Concentrations", niveau:"premiere", difficulte:2, tags:["concentration-effective","dissolution"], verso_latex:"[X] = \\dfrac{n_X}{V}", verso_texte:"[X] = n_X / V", verso:"$[X] = \\dfrac{n_X}{V}$<div class=\"petit\">Piège : [X] ≠ C. Le lien entre les deux passe par les <b>nombres stœchiométriques de l&#39;équation de dissolution</b>. Ex. Na₂SO₄ → [Na⁺] = 2C et [SO₄²⁻] = C.</div>"},
  // Solubilité
  {nom:"Qu'est-ce que la solubilité d'un corps, et qu'est-ce qu'une solution saturée ?", categorie:"Formules physique-chimie", id:"C0-19", chapitre:"C0", theme:"Solubilité", niveau:"premiere", difficulte:1, tags:["solubilite","solution-saturee"], verso_latex:"s = \\dfrac{m_{\\max}}{V} \\quad \\text{ou} \\quad s = \\dfrac{n_{\\max}}{V}", verso_texte:"s = m_max / V (g·L⁻¹) ou s = n_max / V (mol·L⁻¹)", verso:"$s = \\dfrac{m_{\\max}}{V} \\quad \\text{ou} \\quad s = \\dfrac{n_{\\max}}{V}$<div class=\"petit\">Piège : Quantité <b>maximale</b> de soluté dissoluble dans 1 L de solution, à une température donnée. Au-delà : solution <b>saturée</b>, l&#39;excédent reste solide.</div>"},
  // Dilution
  {nom:"Relation fondamentale de la dilution ?", categorie:"Formules physique-chimie", id:"C0-20", chapitre:"C0", theme:"Dilution", niveau:"premiere", difficulte:1, tags:["dilution","conservation"], verso_latex:"C_{\\text{mère}} \\times V_{\\text{mère}} = C_{\\text{fille}} \\times V_{\\text{fille}}", verso_texte:"C_mère × V_mère = C_fille × V_fille", verso:"$C_{\\text{mère}} \\times V_{\\text{mère}} = C_{\\text{fille}} \\times V_{\\text{fille}}$<div class=\"petit\">Piège : Elle traduit la <b>conservation de la quantité de matière de soluté</b> — c&#39;est cette phrase qu&#39;il faut écrire avant la formule.</div>"},
  {nom:"Définition du facteur de dilution k ?", categorie:"Formules physique-chimie", id:"C0-21", chapitre:"C0", theme:"Dilution", niveau:"premiere", difficulte:1, tags:["dilution"], verso_latex:"k = \\dfrac{C}{C'} = \\dfrac{V'}{V}", verso_texte:"k = C / C' = V' / V", verso:"$k = \\dfrac{C}{C&#39;} = \\dfrac{V&#39;}{V}$<div class=\"petit\">C, V — solution-mère<br>C&#39;, V&#39; — solution-fille (C &gt; C&#39; et V&#39; &gt; V)</div><div class=\"petit\">Piège : k &gt; 1 toujours. « Diluer 250 fois » ⇒ k = 250.</div>"},
  {nom:"Volume de solution-mère à prélever pour préparer un volume V' de solution-fille ?", categorie:"Formules physique-chimie", id:"C0-22", chapitre:"C0", theme:"Dilution", niveau:"premiere", difficulte:1, tags:["dilution","protocole"], verso_latex:"V = \\dfrac{C' \\times V'}{C} = \\dfrac{V'}{k}", verso_texte:"V = (C' × V') / C = V' / k", verso:"$V = \\dfrac{C&#39; \\times V&#39;}{C} = \\dfrac{V&#39;}{k}$"},
  // Protocole
  {nom:"Protocole de préparation d'une solution par dissolution ?", categorie:"Formules physique-chimie", id:"K-06", chapitre:"C0", theme:"Protocole", niveau:"premiere", difficulte:2, tags:["protocole","dissolution","TP"], verso_texte:"1) Peser le soluté à la balance de précision, l'introduire intégralement dans une fiole jaugée de volume V (rincer coupelle et entonnoir avec le solvant au-dessus de la fiole). 2) Remplir la fiole aux 2/3 de solvant, agiter pour dissoudre. 3) Compléter jusqu'au trait de jauge et homogénéiser.", verso:"1) Peser le soluté à la balance de précision, l&#39;introduire intégralement dans une fiole jaugée de volume V (rincer coupelle et entonnoir avec le solvant au-dessus de la fiole). 2) Remplir la fiole aux 2/3 de solvant, agiter pour dissoudre. 3) Compléter jusqu&#39;au trait de jauge et homogénéiser."},
  {nom:"Protocole de préparation d'une solution par dilution ?", categorie:"Formules physique-chimie", id:"K-07", chapitre:"C0", theme:"Protocole", niveau:"premiere", difficulte:2, tags:["protocole","dilution","TP"], verso_texte:"1) Calculer V = C'V'/C. 2) Choisir la verrerie jaugée (pipette jaugée pour V, fiole jaugée pour V'). 3) Prélever V de solution-mère avec la verrerie rincée à l'eau distillée puis à la solution-mère. 4) Introduire dans la fiole jaugée de volume V' rincée à l'eau distillée. 5) Compléter au trait de jauge. 6) Agiter pour homogénéiser.", verso:"1) Calculer V = C&#39;V&#39;/C. 2) Choisir la verrerie jaugée (pipette jaugée pour V, fiole jaugée pour V&#39;). 3) Prélever V de solution-mère avec la verrerie rincée à l&#39;eau distillée puis à la solution-mère. 4) Introduire dans la fiole jaugée de volume V&#39; rincée à l&#39;eau distillée. 5) Compléter au trait de jauge. 6) Agiter pour homogénéiser.<div class=\"petit\">Piège : La verrerie de prélèvement se rince à la <b>solution-mère</b> ; la fiole jaugée, à l&#39;<b>eau distillée</b> seulement.</div>"},
  // Verrerie
  {nom:"Verrerie jaugée vs verrerie graduée : laquelle choisir et pourquoi ?", categorie:"Formules physique-chimie", id:"K-08", chapitre:"C0", theme:"Verrerie", niveau:"premiere", difficulte:1, tags:["verrerie","TP","precision"], verso_texte:"Jaugée (pipette jaugée, fiole jaugée) : un seul volume, toujours plus précise → à privilégier. Graduée (pipette, burette, éprouvette) : plusieurs volumes, moins précise → si le volume voulu ne correspond à aucune pipette jaugée disponible. Précautions : propipette obligatoire, prélever depuis un bécher jamais depuis le flacon, éviter la parallaxe, lire au bas du ménisque.", verso:"Jaugée (pipette jaugée, fiole jaugée) : un seul volume, toujours plus précise → à privilégier. Graduée (pipette, burette, éprouvette) : plusieurs volumes, moins précise → si le volume voulu ne correspond à aucune pipette jaugée disponible. Précautions : propipette obligatoire, prélever depuis un bécher jamais depuis le flacon, éviter la parallaxe, lire au bas du ménisque."},
  // Notations
  {nom:"Quelles notations de quantité de matière faut-il distinguer, et pourquoi ?", categorie:"Formules physique-chimie", id:"K-09", chapitre:"C0", theme:"Notations", niveau:"premiere", difficulte:2, tags:["notations","rigueur","avancement"], verso_texte:"n(X)apporté (ou initial), n(X)consommé, n(X)formé, n(X)restant. Écrire n(X) sans indice n'a aucun sens suffisamment précis. Seules les quantités consommées et formées entrent dans la relation de proportionnalité stœchiométrique.", verso:"n(X)apporté (ou initial), n(X)consommé, n(X)formé, n(X)restant. Écrire n(X) sans indice n&#39;a aucun sens suffisamment précis. Seules les quantités consommées et formées entrent dans la relation de proportionnalité stœchiométrique."},
  // --- C1 — Transformations acido-basiques
  // Constantes
  {nom:"Que vaut la concentration standard c° utilisée dans la définition du pH ?", categorie:"Formules physique-chimie", id:"CST-05", chapitre:"C1", theme:"Constantes", niveau:"terminale", difficulte:1, tags:["constante","pH"], verso_latex:"c^\\circ = 1{,}0\\ \\mathrm{mol\\cdot L^{-1}}", verso_texte:"c° = 1,0 mol·L⁻¹", verso:"$c^\\circ = 1{,}0\\ \\mathrm{mol\\cdot L^{-1}}$<div class=\"petit\">Piège : c° sert uniquement à rendre le rapport sans unité — c&#39;est ce qui permet d&#39;appliquer le log.</div>"},
  // Couple acide-base
  {nom:"Forme générale d'une demi-équation acido-basique ?", categorie:"Formules physique-chimie", id:"C1-01", chapitre:"C1", theme:"Couple acide-base", niveau:"terminale", difficulte:1, tags:["brønsted","couple","demi-equation"], verso_latex:"\\mathrm{acide} = \\mathrm{base} + \\mathrm{H^+} \\qquad AH = A^- + \\mathrm{H^+} \\qquad BH^+ = B + \\mathrm{H^+}", verso_texte:"acide = base + H⁺   |   AH = A⁻ + H⁺   |   BH⁺ = B + H⁺", verso:"$\\mathrm{acide} = \\mathrm{base} + \\mathrm{H^+} \\qquad AH = A^- + \\mathrm{H^+} \\qquad BH^+ = B + \\mathrm{H^+}$<div class=\"petit\">Piège : Signe <b>=</b> pour une demi-équation, jamais une flèche.</div>"},
  // Réaction acide-base
  {nom:"Comment établit-on l'équation d'une réaction acide-base à partir de deux couples ?", categorie:"Formules physique-chimie", id:"C1-02", chapitre:"C1", theme:"Réaction acide-base", niveau:"terminale", difficulte:2, tags:["reaction-acide-base","methode"], verso_latex:"\\begin{aligned} \\mathrm{acide_1} &= \\mathrm{base_1} + \\mathrm{H^+} \\\\ \\mathrm{base_2} + \\mathrm{H^+} &= \\mathrm{acide_2} \\\\ \\hline \\mathrm{acide_1} + \\mathrm{base_2} &\\rightarrow \\mathrm{base_1} + \\mathrm{acide_2} \\end{aligned}", verso_texte:"acide₁ = base₁ + H⁺  /  base₂ + H⁺ = acide₂  →  acide₁ + base₂ → base₁ + acide₂", verso:"$\\begin{aligned} \\mathrm{acide_1} &amp;= \\mathrm{base_1} + \\mathrm{H^+} \\\\ \\mathrm{base_2} + \\mathrm{H^+} &amp;= \\mathrm{acide_2} \\\\ \\hline \\mathrm{acide_1} + \\mathrm{base_2} &amp;\\rightarrow \\mathrm{base_1} + \\mathrm{acide_2} \\end{aligned}$<div class=\"petit\">Piège : La demi-équation de la <b>base₂ est inversée</b>. Le H⁺ doit se simplifier : il ne doit jamais apparaître dans l&#39;équation bilan. La flèche → indique le sens d&#39;évolution.</div>"},
  // Amphotère
  {nom:"Qu'est-ce qu'une espèce amphotère (ampholyte) ? Deux exemples.", categorie:"Formules physique-chimie", id:"C1-03", chapitre:"C1", theme:"Amphotère", niveau:"terminale", difficulte:1, tags:["amphotere","ampholyte"], verso_latex:"\\mathrm{H_2O}\\,:\\ \\mathrm{H_2O/HO^-}\\ \\text{et}\\ \\mathrm{H_3O^+/H_2O} \\qquad ; \\qquad \\mathrm{HCO_3^-}\\,:\\ \\mathrm{H_2CO_3/HCO_3^-}\\ \\text{et}\\ \\mathrm{HCO_3^-/CO_3^{2-}}", verso_texte:"H₂O : couples H₂O/HO⁻ et H₃O⁺/H₂O ; HCO₃⁻ : couples H₂CO₃/HCO₃⁻ et HCO₃⁻/CO₃²⁻", verso:"$\\mathrm{H_2O}\\,:\\ \\mathrm{H_2O/HO^-}\\ \\text{et}\\ \\mathrm{H_3O^+/H_2O} \\qquad ; \\qquad \\mathrm{HCO_3^-}\\,:\\ \\mathrm{H_2CO_3/HCO_3^-}\\ \\text{et}\\ \\mathrm{HCO_3^-/CO_3^{2-}}$<div class=\"petit\">Piège : Espèce qui appartient à <b>deux couples</b> : acide dans l&#39;un, base dans l&#39;autre. Méthode de repérage : la chercher deux fois dans la liste des couples donnée.</div>"},
  // pH
  {nom:"Définition du pH d'une solution aqueuse ?", categorie:"Formules physique-chimie", id:"C1-04", chapitre:"C1", theme:"pH", niveau:"terminale", difficulte:1, tags:["pH","oxonium"], verso_latex:"\\mathrm{pH} = -\\log\\left(\\dfrac{[\\mathrm{H_3O^+}]}{c^\\circ}\\right)", verso_texte:"pH = −log( [H₃O⁺] / c° )", verso:"$\\mathrm{pH} = -\\log\\left(\\dfrac{[\\mathrm{H_3O^+}]}{c^\\circ}\\right)$<div class=\"petit\">pH — sans unité<br>[H₃O⁺] — mol·L⁻¹<br>c° = 1,0 mol·L⁻¹</div><div class=\"petit\">Piège : Le rapport par c° rend l&#39;argument du log sans unité. Le pH n&#39;a <b>pas</b> d&#39;unité.</div>"},
  {nom:"Concentration en ions oxonium à partir du pH ?", categorie:"Formules physique-chimie", id:"C1-05", chapitre:"C1", theme:"pH", niveau:"terminale", difficulte:1, tags:["pH","oxonium","reciproque"], verso_latex:"[\\mathrm{H_3O^+}] = c^\\circ \\times 10^{-\\mathrm{pH}}", verso_texte:"[H₃O⁺] = c° × 10^(−pH)", verso:"$[\\mathrm{H_3O^+}] = c^\\circ \\times 10^{-\\mathrm{pH}}$<div class=\"petit\">Piège : Résultat en mol·L⁻¹, à exprimer avec <b>2 chiffres significatifs maximum</b>.</div>"},
  // Logarithme
  {nom:"Propriétés de la fonction logarithme décimal à connaître ?", categorie:"Formules physique-chimie", id:"C1-06", chapitre:"C1", theme:"Logarithme", niveau:"terminale", difficulte:1, tags:["logarithme","mathematiques"], verso_latex:"\\log(10^x) = x \\quad ; \\quad 10^{\\log x} = x \\quad ; \\quad \\log 1 = 0 \\quad ; \\quad \\log(x \\times y) = \\log x + \\log y", verso_texte:"log(10^x) = x ; 10^(log x) = x ; log 1 = 0 ; log(x × y) = log x + log y", verso:"$\\log(10^x) = x \\quad ; \\quad 10^{\\log x} = x \\quad ; \\quad \\log 1 = 0 \\quad ; \\quad \\log(x \\times y) = \\log x + \\log y$<div class=\"petit\">Piège : log est croissante, définie pour x &gt; 0 seulement. Sa réciproque est 10^x.</div>"},
  // pH
  {nom:"Comment varie le pH quand [H₃O⁺] augmente ?", categorie:"Formules physique-chimie", id:"C1-07", chapitre:"C1", theme:"pH", niveau:"terminale", difficulte:2, tags:["pH","variation"], verso_latex:"[\\mathrm{H_3O^+}] \\nearrow \\;\\Longrightarrow\\; \\log[\\mathrm{H_3O^+}] \\nearrow \\;\\Longrightarrow\\; \\mathrm{pH} \\searrow", verso_texte:"[H₃O⁺] augmente ⇒ log[H₃O⁺] augmente ⇒ pH diminue", verso:"$[\\mathrm{H_3O^+}] \\nearrow \\;\\Longrightarrow\\; \\log[\\mathrm{H_3O^+}] \\nearrow \\;\\Longrightarrow\\; \\mathrm{pH} \\searrow$<div class=\"petit\">Piège : Le signe « − » de la définition inverse le sens de variation. Plus la solution est acide, plus le pH est <b>petit</b>.</div>"},
  {nom:"Quelle règle de chiffres significatifs s'applique à une concentration déduite d'une mesure de pH ? Pourquoi ?", categorie:"Formules physique-chimie", id:"C1-08", chapitre:"C1", theme:"pH", niveau:"terminale", difficulte:2, tags:["pH","incertitude","chiffres-significatifs"], verso_latex:"\\Delta \\mathrm{pH} = \\pm\\,0{,}1 \\;\\Longrightarrow\\; \\dfrac{\\Delta[\\mathrm{H_3O^+}]}{[\\mathrm{H_3O^+}]} \\approx 20\\,\\%", verso_texte:"ΔpH = ±0,1 ⇒ Δ[H₃O⁺]/[H₃O⁺] ≈ 20 %", verso:"$\\Delta \\mathrm{pH} = \\pm\\,0{,}1 \\;\\Longrightarrow\\; \\dfrac{\\Delta[\\mathrm{H_3O^+}]}{[\\mathrm{H_3O^+}]} \\approx 20\\,\\%$<div class=\"petit\">Piège : Jamais plus de <b>2 chiffres significatifs</b> sur une concentration déduite d&#39;un pH. L&#39;échelle logarithmique amplifie l&#39;incertitude : ~2 % sur le pH devient ~20 % sur la concentration.</div>"},
  // Solution tampon
  {nom:"Qu'est-ce qu'une solution tampon ?", categorie:"Formules physique-chimie", id:"C1-09", chapitre:"C1", theme:"Solution tampon", niveau:"terminale", difficulte:1, tags:["tampon","pH-metre"], verso_latex:"\\text{pH} \\approx \\text{constant lors d'un ajout modéré d'acide, de base, ou d'une dilution}", verso_texte:"Solution dont le pH reste pratiquement constant lors d'un ajout modéré d'acide ou de base, ou lors d'une dilution.", verso:"$\\text{pH} \\approx \\text{constant lors d&#39;un ajout modéré d&#39;acide, de base, ou d&#39;une dilution}$<div class=\"petit\">Piège : Usage principal en TP : <b>étalonnage du pH-mètre</b> avec deux solutions tampons de pH connu.</div>"},
  // Concentration effective
  {nom:"Pour un monoacide fort et pour un diacide fort de concentration C, que valent les concentrations effectives ?", categorie:"Formules physique-chimie", id:"C1-10", chapitre:"C1", theme:"Concentration effective", niveau:"terminale", difficulte:2, tags:["concentration-effective","acide-fort","dissolution"], verso_latex:"\\text{monoacide : } [\\mathrm{H_3O^+}] = C \\qquad ; \\qquad \\text{diacide (ex. } \\mathrm{H_2SO_4}) : [\\mathrm{H_3O^+}] = 2C \\;\\text{ et }\\; [\\mathrm{SO_4^{2-}}] = C", verso_texte:"Monoacide fort : [H₃O⁺] = C. Diacide fort (H₂SO₄) : [H₃O⁺] = 2C et [SO₄²⁻] = C", verso:"$\\text{monoacide : } [\\mathrm{H_3O^+}] = C \\qquad ; \\qquad \\text{diacide (ex. } \\mathrm{H_2SO_4}) : [\\mathrm{H_3O^+}] = 2C \\;\\text{ et }\\; [\\mathrm{SO_4^{2-}}] = C$<div class=\"petit\">Piège : Les coefficients viennent directement des <b>nombres stœchiométriques</b> de l&#39;équation de dissolution. Erreur classique : oublier le facteur 2.</div>"},
  // Mélange acide-base
  {nom:"Méthode pour déterminer le pH d'un mélange acide fort / base forte ?", categorie:"Formules physique-chimie", id:"C1-11", chapitre:"C1", theme:"Mélange acide-base", niveau:"terminale", difficulte:3, tags:["melange","tableau-avancement","pH","methode"], verso_latex:"n_0(\\mathrm{H_3O^+}) = C\\,V \\;;\\; n_0(\\mathrm{OH^-}) = C'V' \\;;\\; x_{max} = \\min(n_0(\\mathrm{H_3O^+}), n_0(\\mathrm{OH^-})) \\;;\\; [\\mathrm{H_3O^+}]_f = \\dfrac{n_0(\\mathrm{H_3O^+}) - x_{max}}{V + V'}", verso_texte:"n0(H₃O⁺) = C·V ; n0(OH⁻) = C'·V' ; x_max = min(...) ; [H₃O⁺]f = (n0(H₃O⁺) − x_max)/(V + V') ; pH = −log([H₃O⁺]f/c°)", verso:"$n_0(\\mathrm{H_3O^+}) = C\\,V \\;;\\; n_0(\\mathrm{OH^-}) = C&#39;V&#39; \\;;\\; x_{max} = \\min(n_0(\\mathrm{H_3O^+}), n_0(\\mathrm{OH^-})) \\;;\\; [\\mathrm{H_3O^+}]_f = \\dfrac{n_0(\\mathrm{H_3O^+}) - x_{max}}{V + V&#39;}$<div class=\"petit\">Piège : Diviser par le volume <b>total</b> V + V&#39;. Réaction : H₃O⁺ + OH⁻ → 2 H₂O (coefficients 1-1).</div>"},
  // Brønsted
  {nom:"Définitions d'un acide et d'une base selon Brønsted ?", categorie:"Formules physique-chimie", id:"K-01", chapitre:"C1", theme:"Brønsted", niveau:"terminale", difficulte:1, tags:["brønsted","definitions","cours"], verso_texte:"Acide : espèce chimique susceptible de céder un ou plusieurs protons H⁺. Base : espèce chimique susceptible de capter un ou plusieurs protons H⁺.", verso:"Acide : espèce chimique susceptible de céder un ou plusieurs protons H⁺. Base : espèce chimique susceptible de capter un ou plusieurs protons H⁺."},
  // Couples à connaître
  {nom:"Les couples acide/base du cours à connaître ?", categorie:"Formules physique-chimie", id:"K-02", chapitre:"C1", theme:"Couples à connaître", niveau:"terminale", difficulte:2, tags:["couples","memorisation"], verso_texte:"H₂O/OH⁻ | H₃O⁺/H₂O | RCOOH/RCOO⁻ | CH₃COOH/CH₃COO⁻ | HCl/Cl⁻ | H₂CO₃/HCO₃⁻ | HCO₃⁻/CO₃²⁻ | HNO₃/NO₃⁻ | NH₄⁺/NH₃ | RNH₃⁺/RNH₂ | CH₃NH₃⁺/CH₃NH₂", verso:"H₂O/OH⁻ | H₃O⁺/H₂O | RCOOH/RCOO⁻ | CH₃COOH/CH₃COO⁻ | HCl/Cl⁻ | H₂CO₃/HCO₃⁻ | HCO₃⁻/CO₃²⁻ | HNO₃/NO₃⁻ | NH₄⁺/NH₃ | RNH₃⁺/RNH₂ | CH₃NH₃⁺/CH₃NH₂"},
  // Lewis
  {nom:"Comment reconnaît-on un acide et une base sur un schéma de Lewis ?", categorie:"Formules physique-chimie", id:"K-03", chapitre:"C1", theme:"Lewis", niveau:"terminale", difficulte:2, tags:["lewis","structure","identification"], verso_texte:"Acide : liaison polarisée entre un H et un atome plus électronégatif (O, N, Cl) → rupture et libération de H⁺. Base : un ou plusieurs doublets non liants sur O ou N → le doublet comble la lacune électronique du H⁺.", verso:"Acide : liaison polarisée entre un H et un atome plus électronégatif (O, N, Cl) → rupture et libération de H⁺. Base : un ou plusieurs doublets non liants sur O ou N → le doublet comble la lacune électronique du H⁺."},
  // Indicateurs colorés
  {nom:"Zones de virage des trois indicateurs colorés usuels ?", categorie:"Formules physique-chimie", id:"K-04", chapitre:"C1", theme:"Indicateurs colorés", niveau:"terminale", difficulte:2, tags:["indicateurs-colores","pH","memorisation"], verso_texte:"Hélianthine : rouge (pH<3,0) → jaune (pH>4,5). BBT : jaune (pH<6,0) → vert (6,0–7,6) → bleu (pH>7,6). Phénolphtaléine : incolore (pH<8,2) → rose (pH>10,0).", verso:"Hélianthine : rouge (pH&lt;3,0) → jaune (pH&gt;4,5). BBT : jaune (pH&lt;6,0) → vert (6,0–7,6) → bleu (pH&gt;7,6). Phénolphtaléine : incolore (pH&lt;8,2) → rose (pH&gt;10,0)."},
  // pH-mètre
  {nom:"Précision d'un pH-mètre et procédure préalable à son utilisation ?", categorie:"Formules physique-chimie", id:"K-05", chapitre:"C1", theme:"pH-mètre", niveau:"terminale", difficulte:1, tags:["pH-metre","mesure","protocole"], verso_texte:"Précision : 0,1 unité de pH (donc tout résultat de pH s'arrondit au dixième). Avant usage : étalonnage avec deux solutions tampons de pH connu.", verso:"Précision : 0,1 unité de pH (donc tout résultat de pH s&#39;arrondit au dixième). Avant usage : étalonnage avec deux solutions tampons de pH connu."},
  // --- C2 — Méthodes physiques d'analyse
  // Constantes
  {nom:"Quelle est la valeur de la constante des gaz parfaits ?", categorie:"Formules physique-chimie", id:"CST-03", chapitre:"C2", theme:"Constantes", niveau:"terminale", difficulte:1, tags:["constante","gaz-parfait"], verso_latex:"R = 8{,}314\\ \\mathrm{J\\cdot K^{-1}\\cdot mol^{-1}}", verso_texte:"R = 8,314 J·K⁻¹·mol⁻¹", verso:"$R = 8{,}314\\ \\mathrm{J\\cdot K^{-1}\\cdot mol^{-1}}$"},
  // Spectrophotométrie
  {nom:"Définition de la transmittance ?", categorie:"Formules physique-chimie", id:"C2-01", chapitre:"C2", theme:"Spectrophotométrie", niveau:"terminale", difficulte:1, tags:["transmittance","spectrophotometrie"], verso_latex:"T = \\dfrac{I}{I_0}", verso_texte:"T = I / I₀", verso:"$T = \\dfrac{I}{I_0}$<div class=\"petit\">I₀ — intensité <b>avant</b> l&#39;échantillon<br>I — intensité <b>après</b> l&#39;échantillon</div><div class=\"petit\">Piège : Sans unité, comprise entre 0 et 1 (ou 0 et 100 %).</div>"},
  {nom:"Définition de l'absorbance ?", categorie:"Formules physique-chimie", id:"C2-02", chapitre:"C2", theme:"Spectrophotométrie", niveau:"terminale", difficulte:1, tags:["absorbance","spectrophotometrie","logarithme"], verso_latex:"A = -\\log T = \\log\\dfrac{I_0}{I}", verso_texte:"A = −log T = log(I₀ / I)", verso:"$A = -\\log T = \\log\\dfrac{I_0}{I}$<div class=\"petit\">Piège : Sans unité. En pratique, les appareils courants mesurent jusqu&#39;à A = 2. A = 0 ⇒ lumière totalement transmise. I = I₀/10 ⇒ A = 1 ; I = I₀/100 ⇒ A = 2.</div>"},
  // Beer-Lambert
  {nom:"Énoncé de la loi de Beer-Lambert ?", categorie:"Formules physique-chimie", id:"C2-03", chapitre:"C2", theme:"Beer-Lambert", niveau:"terminale", difficulte:1, tags:["beer-lambert","absorbance","loi"], verso_latex:"A = \\varepsilon \\times \\ell \\times C", verso_texte:"A = ε × ℓ × C", verso:"$A = \\varepsilon \\times \\ell \\times C$<div class=\"petit\">A — absorbance — sans unité<br>ε — coefficient d&#39;extinction molaire — L·mol⁻¹·cm⁻¹<br>ℓ — épaisseur de solution traversée — cm<br>C — concentration molaire — mol·L⁻¹</div><div class=\"petit\">Piège : Unités <b>non SI</b> ici (cm et mol·L⁻¹). ε dépend de l&#39;espèce <b>et</b> de la longueur d&#39;onde λ.</div>"},
  {nom:"Quel est le domaine de validité de la loi de Beer-Lambert ? (4 conditions)", categorie:"Formules physique-chimie", id:"C2-04", chapitre:"C2", theme:"Beer-Lambert", niveau:"terminale", difficulte:2, tags:["beer-lambert","validite","cours"], verso_latex:"\\text{(1) lumière monochromatique} \\;;\\; \\text{(2) } C \\lesssim 10^{-2}\\ \\mathrm{mol\\cdot L^{-1}} \\;;\\; \\text{(3) solution homogène et limpide} \\;;\\; \\text{(4) pas d'association soluté-solvant variable}", verso_texte:"(1) lumière monochromatique ; (2) solution diluée, C ≲ 10⁻² mol·L⁻¹ ; (3) solution homogène et limpide (ni précipité ni gaz), soluté non photosensible ; (4) pas d'associations variables avec le solvant", verso:"$\\text{(1) lumière monochromatique} \\;;\\; \\text{(2) } C \\lesssim 10^{-2}\\ \\mathrm{mol\\cdot L^{-1}} \\;;\\; \\text{(3) solution homogène et limpide} \\;;\\; \\text{(4) pas d&#39;association soluté-solvant variable}$<div class=\"petit\">Piège : Capacité exigible explicitement listée par le prof — question de cours probable.</div>"},
  // Spectrophotométrie
  {nom:"Quels sont les domaines de longueur d'onde de l'UV et du visible, et quelles espèces y absorbent ?", categorie:"Formules physique-chimie", id:"C2-05", chapitre:"C2", theme:"Spectrophotométrie", niveau:"terminale", difficulte:1, tags:["UV-visible","spectre","conjugaison"], verso_latex:"\\mathrm{UV}: 200\\text{–}400\\ \\mathrm{nm} \\;;\\; \\mathrm{Visible}: 400\\text{–}800\\ \\mathrm{nm}", verso_texte:"UV : 200–400 nm (doublets libres O, N ; liaisons multiples). Visible : 400–800 nm (liaisons multiples conjuguées).", verso:"$\\mathrm{UV}: 200\\text{–}400\\ \\mathrm{nm} \\;;\\; \\mathrm{Visible}: 400\\text{–}800\\ \\mathrm{nm}$<div class=\"petit\">Piège : Plus il y a de liaisons multiples <b>conjuguées</b>, plus l&#39;absorption se déplace vers les <b>grandes</b> longueurs d&#39;onde (β-carotène).</div>"},
  {nom:"À quelle longueur d'onde réalise-t-on un dosage par spectrophotométrie, et pourquoi ?", categorie:"Formules physique-chimie", id:"C2-06", chapitre:"C2", theme:"Spectrophotométrie", niveau:"terminale", difficulte:1, tags:["dosage","spectrophotometrie","lambda-max"], verso_latex:"\\lambda = \\lambda_{max} \\quad \\text{(maximum d'absorbance de l'espèce dosée)}", verso_texte:"λ = λ_max : au maximum d'absorbance de l'espèce à doser, pour maximiser la sensibilité — et là où les autres espèces n'absorbent pas.", verso:"$\\lambda = \\lambda_{max} \\quad \\text{(maximum d&#39;absorbance de l&#39;espèce dosée)}$<div class=\"petit\">Piège : Double critère : sensibilité maximale <b>et</b> absence d&#39;interférence des autres espèces présentes.</div>"},
  // Infrarouge
  {nom:"Définition du nombre d'onde en spectroscopie IR ?", categorie:"Formules physique-chimie", id:"C2-07", chapitre:"C2", theme:"Infrarouge", niveau:"terminale", difficulte:1, tags:["infrarouge","nombre-onde"], verso_latex:"\\sigma = \\dfrac{1}{\\lambda}", verso_texte:"σ = 1 / λ", verso:"$\\sigma = \\dfrac{1}{\\lambda}$<div class=\"petit\">σ — nombre d&#39;onde — cm⁻¹<br>λ — longueur d&#39;onde — cm</div><div class=\"petit\">Piège : λ à convertir en <b>cm</b>, pas en m ni en µm. Le domaine IR va de 2,5 µm à 16 µm, soit 4000 à 625 cm⁻¹.</div>"},
  {nom:"Que représente un spectre IR, et comment se lit-il ?", categorie:"Formules physique-chimie", id:"C2-08", chapitre:"C2", theme:"Infrarouge", niveau:"terminale", difficulte:1, tags:["infrarouge","spectre","lecture"], verso_latex:"T(\\%) = f(\\sigma) \\quad \\text{avec } \\sigma \\text{ décroissant de gauche à droite}", verso_texte:"Transmission T (en %) en fonction du nombre d'onde σ (cm⁻¹), axe orienté de droite à gauche. Bandes vers le bas.", verso:"$T(\\%) = f(\\sigma) \\quad \\text{avec } \\sigma \\text{ décroissant de gauche à droite}$<div class=\"petit\">Piège : &gt; 1200 cm⁻¹ : groupes caractéristiques (exploitable). &lt; 1200 cm⁻¹ : <b>empreinte digitale</b>, non exploitable.</div>"},
  {nom:"Bandes IR caractéristiques à connaître (liaison → nombre d'onde) ?", categorie:"Formules physique-chimie", id:"C2-09", chapitre:"C2", theme:"Infrarouge", niveau:"terminale", difficulte:2, tags:["infrarouge","table","groupes-caracteristiques"], verso_latex:"\\mathrm{C{-}H}\\,(alcane): 2850\\text{–}3000 \\;;\\; \\mathrm{C{=}O}: 1705\\text{–}1800 \\;;\\; \\mathrm{O{-}H}\\,(alcool\\ lié): 3200\\text{–}3450 \\;;\\; \\mathrm{O{-}H}\\,(acide): 3450\\text{–}3550", verso_texte:"C–H alcane : 2850–3000 cm⁻¹ (F) | C=O cétone : 1705–1725 | C=O aldéhyde : 1720–1740 | C=O acide : 1740–1800 | O–H alcool lié : 3200–3450 (large) | O–H acide : 3450–3550 (large) | C–O acide : 1080–1190", verso:"$\\mathrm{C{-}H}\\,(alcane): 2850\\text{–}3000 \\;;\\; \\mathrm{C{=}O}: 1705\\text{–}1800 \\;;\\; \\mathrm{O{-}H}\\,(alcool\\ lié): 3200\\text{–}3450 \\;;\\; \\mathrm{O{-}H}\\,(acide): 3450\\text{–}3550$<div class=\"petit\">Piège : Les O–H donnent des bandes <b>larges et arrondies</b> — c&#39;est le critère visuel de reconnaissance.</div>"},
  {nom:"Méthode pour identifier une famille à partir d'un spectre IR ?", categorie:"Formules physique-chimie", id:"C2-10", chapitre:"C2", theme:"Infrarouge", niveau:"terminale", difficulte:2, tags:["infrarouge","methode","identification"], verso_latex:"\\mathrm{C{=}O}\\ \\text{seul} \\Rightarrow \\text{aldéhyde ou cétone} \\;;\\; \\mathrm{C{=}O} + \\mathrm{O{-}H}\\ \\text{large} \\Rightarrow \\text{acide carboxylique} \\;;\\; \\mathrm{O{-}H}\\ \\text{seul} \\Rightarrow \\text{alcool}", verso_texte:"1) Bande vers 1700 ⇒ C=O. 2) Bande large vers 3200–3600 ⇒ O–H. 3) C=O seul ⇒ aldéhyde/cétone ; C=O + O–H large ⇒ acide carboxylique ; O–H seul ⇒ alcool. 4) Trancher avec la formule brute.", verso:"$\\mathrm{C{=}O}\\ \\text{seul} \\Rightarrow \\text{aldéhyde ou cétone} \\;;\\; \\mathrm{C{=}O} + \\mathrm{O{-}H}\\ \\text{large} \\Rightarrow \\text{acide carboxylique} \\;;\\; \\mathrm{O{-}H}\\ \\text{seul} \\Rightarrow \\text{alcool}$<div class=\"petit\">Piège : Toujours croiser avec la <b>formule brute</b> : un seul atome d&#39;O exclut l&#39;acide carboxylique.</div>"},
  // Conductimétrie
  {nom:"Relation entre conductance, résistance, tension et intensité ?", categorie:"Formules physique-chimie", id:"C2-11", chapitre:"C2", theme:"Conductimétrie", niveau:"terminale", difficulte:1, tags:["conductance","ohm"], verso_latex:"G = \\dfrac{1}{R} = \\dfrac{I}{U}", verso_texte:"G = 1/R = I/U", verso:"$G = \\dfrac{1}{R} = \\dfrac{I}{U}$<div class=\"petit\">G — conductance — <b>siemens (S)</b><br>R — résistance — ohm (Ω)<br>U — tension — V<br>I — intensité — A</div><div class=\"petit\">Piège : G = I/U vient directement de la loi d&#39;Ohm U = R·I.</div>"},
  {nom:"Relation entre conductance et conductivité (cellule conductimétrique) ?", categorie:"Formules physique-chimie", id:"C2-12", chapitre:"C2", theme:"Conductimétrie", niveau:"terminale", difficulte:2, tags:["conductivite","conductance","cellule"], verso_latex:"G = \\sigma \\times \\dfrac{S}{L} \\qquad\\Longleftrightarrow\\qquad \\sigma = G \\times \\dfrac{L}{S}", verso_texte:"G = σ × S/L  ⟺  σ = G × L/S", verso:"$G = \\sigma \\times \\dfrac{S}{L} \\qquad\\Longleftrightarrow\\qquad \\sigma = G \\times \\dfrac{L}{S}$<div class=\"petit\">σ — conductivité — S·m⁻¹<br>S — aire des plaques — m²<br>L — distance entre les plaques — m</div><div class=\"petit\">Piège : L/S est la <b>constante de cellule</b>, propre à l&#39;appareil. G dépend de la cellule, σ non : σ caractérise la solution.</div>"},
  // Kohlrausch
  {nom:"Énoncé de la loi de Kohlrausch ?", categorie:"Formules physique-chimie", id:"C2-13", chapitre:"C2", theme:"Kohlrausch", niveau:"terminale", difficulte:2, tags:["kohlrausch","conductivite","unites","loi"], verso_latex:"\\sigma = \\sum_i \\lambda_i \\times [X_i]", verso_texte:"σ = Σ λᵢ × [Xᵢ]", verso:"$\\sigma = \\sum_i \\lambda_i \\times [X_i]$<div class=\"petit\">σ — conductivité — S·m⁻¹<br>λᵢ — conductivité molaire ionique — S·m²·mol⁻¹<br>[Xᵢ] — concentration effective — <b>mol·m⁻³</b></div><div class=\"petit\">Piège : ⚠️ LE piège du chapitre : les concentrations sont en <b>mol·m⁻³</b>, pas mol·L⁻¹. 1 mol·L⁻¹ = 10³ mol·m⁻³. Somme sur <b>tous</b> les ions présents, anions <b>et</b> cations.</div>"},
  {nom:"Domaine de validité de la loi de Kohlrausch ?", categorie:"Formules physique-chimie", id:"C2-14", chapitre:"C2", theme:"Kohlrausch", niveau:"terminale", difficulte:1, tags:["kohlrausch","validite","cours"], verso_latex:"C < 10^{-2}\\ \\mathrm{mol\\cdot L^{-1}} \\quad (= 10\\ \\mathrm{mol\\cdot m^{-3}})", verso_texte:"Solutions ioniques diluées : C < 10⁻² mol·L⁻¹ (soit 10 mol·m⁻³)", verso:"$C &lt; 10^{-2}\\ \\mathrm{mol\\cdot L^{-1}} \\quad (= 10\\ \\mathrm{mol\\cdot m^{-3}})$<div class=\"petit\">Piège : Capacité exigible explicitement listée par le prof.</div>"},
  {nom:"Pour un électrolyte totalement dissocié de type AB (ex. NaCl) de concentration C, quelle est la conductivité ?", categorie:"Formules physique-chimie", id:"C2-15", chapitre:"C2", theme:"Kohlrausch", niveau:"terminale", difficulte:2, tags:["kohlrausch","etalonnage","dissolution"], verso_latex:"\\sigma = (\\lambda_{A^+} + \\lambda_{B^-}) \\times C = k \\times C", verso_texte:"σ = (λ_A⁺ + λ_B⁻) × C = k × C", verso:"$\\sigma = (\\lambda_{A^+} + \\lambda_{B^-}) \\times C = k \\times C$<div class=\"petit\">Piège : Comme [A⁺] = [B⁻] = C, la conductivité est <b>proportionnelle</b> à C — c&#39;est ce qui justifie la droite d&#39;étalonnage σ = k·C passant par l&#39;origine.</div>"},
  // Gaz parfait
  {nom:"Équation d'état du gaz parfait ?", categorie:"Formules physique-chimie", id:"C2-16", chapitre:"C2", theme:"Gaz parfait", niveau:"terminale", difficulte:1, tags:["gaz-parfait","equation-etat","loi"], verso_latex:"P \\times V = n \\times R \\times T", verso_texte:"P × V = n × R × T", verso:"$P \\times V = n \\times R \\times T$<div class=\"petit\">P — pression — Pa<br>V — volume — m³<br>n — mol<br>T — température <b>absolue</b> — K<br>R = 8,314 J·K⁻¹·mol⁻¹</div><div class=\"petit\">Piège : <b>Unités SI obligatoires</b> : Pa, m³, K. 1 L = 10⁻³ m³ ; 1 hPa = 100 Pa.</div>"},
  {nom:"Conversion degrés Celsius → kelvin ?", categorie:"Formules physique-chimie", id:"C2-17", chapitre:"C2", theme:"Gaz parfait", niveau:"terminale", difficulte:1, tags:["gaz-parfait","temperature","conversion"], verso_latex:"T(\\mathrm{K}) = \\theta(^\\circ\\mathrm{C}) + 273{,}15", verso_texte:"T(K) = θ(°C) + 273,15", verso:"$T(\\mathrm{K}) = \\theta(^\\circ\\mathrm{C}) + 273{,}15$"},
  {nom:"Expression du volume molaire gazeux en fonction de T et P ?", categorie:"Formules physique-chimie", id:"C2-18", chapitre:"C2", theme:"Gaz parfait", niveau:"terminale", difficulte:2, tags:["gaz-parfait","volume-molaire","demonstration"], verso_latex:"V_m = \\dfrac{V}{n} = \\dfrac{R \\times T}{P}", verso_texte:"Vm = V/n = (R × T) / P", verso:"$V_m = \\dfrac{V}{n} = \\dfrac{R \\times T}{P}$<div class=\"petit\">Piège : Résultat en m³·mol⁻¹ ; × 10³ pour l&#39;avoir en L·mol⁻¹. Vérification : à 20 °C et 1013 hPa, Vm = 8,314 × 293,15 / 101300 = 2,41 × 10⁻² m³·mol⁻¹ = 24,1 L·mol⁻¹.</div>"},
  {nom:"Domaine de validité du modèle du gaz parfait ?", categorie:"Formules physique-chimie", id:"C2-19", chapitre:"C2", theme:"Gaz parfait", niveau:"terminale", difficulte:1, tags:["gaz-parfait","validite","cours"], verso_latex:"\\text{gaz à faible pression (gaz dilués)}", verso_texte:"Modèle valable pour des gaz à faible pression (gaz dilués), loin de la liquéfaction.", verso:"$\\text{gaz à faible pression (gaz dilués)}$"},

  {nom:"En quoi consiste un dosage par étalonnage ?", categorie:"Formules physique-chimie", id:"C2-20", chapitre:"C2", theme:"Dosage par étalonnage", niveau:"terminale", difficulte:1, tags:["dosage","etalonnage","methode"], verso_latex:"\\text{grandeur mesurée sur l'inconnue} \\;\\longrightarrow\\; \\text{comparée à une gamme d'étalons de } c_i \\text{ connues}", verso_texte:"Comparer une grandeur physique mesurée sur la solution inconnue à la même grandeur mesurée sur une gamme de solutions étalons de concentrations connues.", verso:"$\\text{grandeur mesurée sur l&#39;inconnue} \\;\\longrightarrow\\; \\text{comparée à une gamme d&#39;étalons de } c_i \\text{ connues}$<div class=\"petit\">Piège : Méthode <b>non destructive</b> : l&#39;espèce dosée n&#39;est pas consommée.</div>"},
